<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">

        <h1>FAQ Chatbot</h1>

        <div id="chat-box"></div>

        <!-- ✅ Suggested Questions -->
        <div class="suggestions">
            <h3>💡 Suggested Questions</h3>

            <ul>
                <li onclick="fillInput(this)">What is your return policy?</li>
                <li onclick="fillInput(this)">How can I track my order?</li>
                <li onclick="fillInput(this)">Do you offer customer support?</li>
                <li onclick="fillInput(this)">How can I reset my password?</li>
                <li onclick="fillInput(this)">What payment methods are accepted?</li>
            </ul>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask a question...">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

<script>

function fillInput(el) {
    document.getElementById("user-input").value = el.innerText;
}

async function sendMessage() {

    const input = document.getElementById("user-input");
    const message = input.value;

    if(message.trim() === "") return;

    const chatBox = document.getElementById("chat-box");

    chatBox.innerHTML += `
        <div class="user-message">${message}</div>
    `;

    input.value = "";

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message })
    });

    const data = await response.json();

    chatBox.innerHTML += `
        <div class="bot-message">${data.response}</div>
    `;

    chatBox.scrollTop = chatBox.scrollHeight;
}

window.onload = function () {
    const chatBox = document.getElementById("chat-box");

    chatBox.innerHTML = `
        <div class="bot-message">
            👋 Hi! I’m your FAQ assistant. Ask me anything or click a suggestion below.
        </div>
    `;

    chatBox.scrollTop = chatBox.scrollHeight;
};

</script>

</body>
</html>
